<!doctype html>
<html lang="en" data-mode="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Istanbul Museums</title>
<meta name="description" content="Map of Istanbul's museums and sights with tickets, opening hours, Museum Pass coverage and walking routes.">
<meta name="theme-color" content="#ffffff">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Museums">
<meta property="og:title" content="Istanbul Museums">
<meta property="og:description" content="Map, tickets, hours and walking routes for Istanbul's museums and sights.">
<meta property="og:image" content="og.png">
<meta property="og:type" content="website">
<meta name="twitter:card" content="summary_large_image">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="favicon.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
:root{
  --bg:#ffffff;--land:#f2f2ef;--mah:#dcdcd7;--water:#d6dee3;--fg:#0d0d0d;--fg2:#555555;--fg3:#868686;
  --line:#dadada;--fill:#ececec;--glass:rgba(255,255,255,.9);--rail:#8a8a8a;--ok:#16803a;--bad:#c81818;--warn:#a65200;
  --a-sa:#EE352E;--a-gh:#FF6319;--a-bg:#00933C;--a-fb:#FCCC0A;--a-bs:#0039A6;--a-as:#B933AD;--a-ap:#808183;
  --font:-apple-system,BlinkMacSystemFont,"Helvetica Neue",Helvetica,Arial,sans-serif;
  --sh:0 6px 24px rgba(0,0,0,.14);--r:14px;color-scheme:light;
  padding-top:0!important;padding-bottom:0!important;
}
:root[data-mode="dark"]{
  --bg:#0b0b0b;--land:#1c1c1c;--mah:#2e2e2e;--water:#0f1418;--fg:#f4f4f4;--fg2:#a8a8a8;--fg3:#6e6e6e;
  --line:#2e2e2e;--fill:#202020;--glass:rgba(22,22,22,.9);--rail:#727272;--ok:#3ccf6a;--bad:#ff5a4f;--warn:#ffa640;color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--water);color:var(--fg);font:15px/1.4 var(--font);overflow:hidden;-webkit-font-smoothing:antialiased;-webkit-text-size-adjust:100%}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0;-webkit-tap-highlight-color:transparent}
a{color:inherit;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
:focus-visible{outline:2px solid var(--fg);outline-offset:2px;border-radius:8px}
svg.i{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;flex:none}

.leaflet-container{overflow:hidden;background:var(--water);outline:0;-webkit-tap-highlight-color:transparent;touch-action:none;font:inherit}
.leaflet-container img{max-width:none!important;max-height:none!important}
.leaflet-pane,.leaflet-tile,.leaflet-marker-icon,.leaflet-tile-container,.leaflet-pane>svg,.leaflet-pane>canvas,.leaflet-layer{position:absolute;left:0;top:0}
.leaflet-tile{user-select:none;-webkit-user-drag:none;visibility:hidden}.leaflet-tile-loaded{visibility:inherit}
.leaflet-fade-anim .leaflet-tile{will-change:opacity}.leaflet-fade-anim .leaflet-pane .leaflet-tile{transition:opacity .2s linear}
.leaflet-pane{z-index:400}.leaflet-map-pane{z-index:0}.leaflet-tile-pane{z-index:200}.leaflet-overlay-pane{z-index:400}.leaflet-marker-pane{z-index:600}
.leaflet-zoom-anim .leaflet-zoom-animated{transition:transform .25s cubic-bezier(0,0,.25,1)}
.leaflet-zoom-animated{transform-origin:0 0}.leaflet-zoom-anim .leaflet-zoom-hide{visibility:hidden}
.leaflet-control-container{display:none}
#map{position:fixed;inset:0}
.attr{position:fixed;z-index:5;right:calc(6px + env(safe-area-inset-right,0px));bottom:calc(4px + env(safe-area-inset-bottom,0px));font-size:9.5px;color:var(--fg3);pointer-events:none}

.b{display:inline-grid;place-items:center;width:28px;height:28px;border-radius:50%;color:#fff;font:700 11px/1 var(--font);letter-spacing:-.02em;flex:none;box-shadow:0 0 0 2px var(--bg)}
.b.y{color:#111}
.b.x{border-radius:4px;transform:rotate(45deg);width:21px;height:21px;margin:3.5px}.b.x>span{transform:rotate(-45deg)}
.mk{position:relative;transition:transform .15s}
.mk .b{width:26px;height:26px;font-size:10.5px;box-shadow:0 0 0 2px var(--bg),0 2px 6px rgba(0,0,0,.28);margin:0}
.mk .b.x{width:19px;height:19px;margin:3.5px}
.mk.off .b{filter:grayscale(1);opacity:.5}
.mk.dim{opacity:.22}.mk.sel{transform:scale(1.3)}
.mk .no{position:absolute;top:-8px;right:-9px;min-width:17px;height:17px;padding:0 4px;border-radius:9px;background:var(--fg);color:var(--bg);font:700 10px/17px var(--font);text-align:center}
.alabel{font:700 10.5px/1 var(--font);letter-spacing:.12em;text-transform:uppercase;color:var(--fg3);white-space:nowrap;transform:translate(-50%,-50%);pointer-events:none}
.alabel.w{font-weight:500;letter-spacing:.04em;text-transform:none;font-style:italic}
.tl{font:700 9px/1 var(--font);background:var(--rail);color:var(--bg);padding:3px 4px;border-radius:3px;transform:translate(-50%,-50%);pointer-events:none;white-space:nowrap}
.me{width:18px;height:18px;border-radius:50%;background:#1a73e8;border:3px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,.35)}

.glass{background:var(--glass);backdrop-filter:blur(18px) saturate(1.4);-webkit-backdrop-filter:blur(18px) saturate(1.4);box-shadow:var(--sh)}
.island{position:fixed;z-index:20;top:calc(10px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);height:36px;padding:0 14px;border-radius:18px;display:flex;align-items:center;gap:8px;font-size:13px;font-weight:600;white-space:nowrap;font-variant-numeric:tabular-nums}
.island .dot{width:8px;height:8px;border-radius:50%;background:var(--ok)}
.island .dot.past{background:var(--warn)}
.island small{color:var(--fg2);font-weight:500;font-size:13px}
.rail{position:fixed;z-index:20;right:calc(10px + env(safe-area-inset-right,0px));top:calc(56px + env(safe-area-inset-top,0px));display:flex;flex-direction:column;gap:8px}
.grp{border-radius:12px;overflow:hidden;display:flex;flex-direction:column}
.ib{width:44px;height:44px;display:grid;place-items:center;color:var(--fg);flex:none}
.grp .ib+.ib{border-top:1px solid var(--line)}
.ib[aria-pressed="true"]{color:#1a73e8}
.toast{position:fixed;z-index:60;left:50%;transform:translateX(-50%);top:calc(54px + env(safe-area-inset-top,0px));width:max-content;max-width:calc(100% - 32px);padding:10px 14px;border-radius:12px;font-size:13.5px;background:var(--fg);color:var(--bg)}

.sheet{position:fixed;z-index:30;left:0;right:0;bottom:0;height:calc(100% - 54px - env(safe-area-inset-top,0px));background:var(--bg);border-radius:16px 16px 0 0;box-shadow:0 -2px 24px rgba(0,0,0,.14);display:flex;flex-direction:column;transition:transform .3s cubic-bezier(.2,.8,.2,1)}
.sheet.drag{transition:none}
.grab{flex:none;height:22px;display:grid;place-items:center;touch-action:none;cursor:grab}
.grab i{width:36px;height:5px;border-radius:3px;background:var(--fg3)}
.head{flex:none;padding:0 max(12px,env(safe-area-inset-right,0px)) 0 max(16px,env(safe-area-inset-left,0px));border-bottom:1px solid var(--line)}
.hrow{display:flex;align-items:center;gap:2px}
.tabs{display:flex;gap:18px;flex:1}
.tabs button{height:44px;font-size:15px;font-weight:600;color:var(--fg2);border-bottom:2px solid transparent;margin-bottom:-1px}
.tabs button[aria-selected="true"]{color:var(--fg);border-color:var(--fg)}
.srch{display:flex;align-items:center;gap:8px;height:38px;border-radius:10px;background:var(--fill);padding:0 10px;margin:0 0 10px;color:var(--fg2)}
.srch input{flex:1;min-width:0;border:0;background:none;outline:0;font:inherit;font-size:16px;color:var(--fg)}
.body{flex:1;overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;padding:6px max(16px,env(safe-area-inset-right,0px)) calc(32px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}

.chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding:4px 0}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;height:32px;padding:0 12px;border-radius:16px;border:1px solid var(--line);font-size:13px;font-weight:600}
.chip[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.gh{display:flex;align-items:center;gap:8px;margin:20px 0 2px;font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--fg2)}
.gh i{width:10px;height:10px;border-radius:50%;flex:none}
.gh span{margin-left:auto;font-weight:600;letter-spacing:0;text-transform:none}
.row{display:flex;align-items:center;gap:12px;width:100%;min-height:58px;padding:8px 0;text-align:left;border-bottom:1px solid var(--line)}
.rt{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px}
.l1,.l2{display:flex;align-items:baseline;gap:8px;min-width:0}
.l1 b{flex:1;min-width:0;font-size:15px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.l2 small{flex:1;min-width:0;font-size:13px;color:var(--fg2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pr{flex:none;font-size:13px;font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap}
.pr em{font-style:normal;font-weight:500;color:var(--fg2)}
.s-open{color:var(--ok)}.s-closed{color:var(--bad)}.s-warn{color:var(--warn)}
.tag{flex:none;display:inline-block;font:700 9.5px/1 var(--font);letter-spacing:.06em;padding:3px 5px;border-radius:4px;border:1px solid currentColor}
.tag.p{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.tag.n{color:var(--fg2)}
.chk{color:var(--ok);font-weight:700}
.empty{padding:32px 0;text-align:center;color:var(--fg2)}
.foot{margin:18px 0 0;color:var(--fg3);font-size:12px;line-height:1.5}

.top{display:flex;align-items:center;gap:8px;margin:4px 0 10px}
.top .ib{width:36px;height:36px;border-radius:18px;background:var(--fill)}
.top b{font-size:17px}
.dh{display:flex;gap:12px;align-items:flex-start}
.dh .b{width:40px;height:40px;font-size:14px}.dh .b.x{width:30px;height:30px;margin:5px}
.dh h2{margin:0;font-size:22px;line-height:1.15;font-weight:700;letter-spacing:-.015em;text-wrap:balance}
.dh p{margin:3px 0 0;color:var(--fg2);font-size:14px}
.acts{display:flex;justify-content:space-between;margin:16px 0}
.act{display:flex;flex-direction:column;align-items:center;gap:5px;font-size:11px;font-weight:600;color:var(--fg2);width:20%;text-decoration:none}
.act span{width:48px;height:48px;border-radius:24px;background:var(--fill);color:var(--fg);display:grid;place-items:center}
.act.on span{background:var(--fg);color:var(--bg)}
.facts{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:8px}
.fact{background:var(--fill);border-radius:12px;padding:10px 12px;min-width:0}
.fact small{display:block;font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--fg2)}
.fact b{display:block;font-size:16px;font-weight:600;margin-top:2px;font-variant-numeric:tabular-nums}
.fact em{display:block;font-style:normal;font-size:12.5px;color:var(--fg2)}
.fact.w{grid-column:1/-1}
.bars{height:8px;border-radius:4px;background:var(--line);margin:8px 0 4px;position:relative}
.bars i{position:absolute;top:0;bottom:0;background:var(--ok);border-radius:4px}
.bars u{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--fg)}
.scale{display:flex;justify-content:space-between;font-size:10.5px;color:var(--fg3);font-variant-numeric:tabular-nums}
.ask{width:100%;text-align:left;border:1.5px solid var(--fg);border-radius:var(--r);padding:12px 14px;margin:4px 0 8px;display:flex;gap:12px;align-items:center}
.ask div{flex:1;min-width:0}
.ask small{display:block;font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--fg2)}
.ask b{display:block;font-size:18px;line-height:1.25;margin:3px 0 2px}
.ask em{display:block;font-style:normal;font-size:13px;color:var(--fg2)}
.txt{padding:12px 0;border-top:1px solid var(--line);font-size:14.5px}
.txt h3{margin:0 0 3px;font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--fg2)}
.txt p{margin:0;max-width:62ch}

.big{position:fixed;inset:0;z-index:70;background:var(--bg);display:flex;flex-direction:column;justify-content:center;padding:calc(24px + env(safe-area-inset-top,0px)) max(28px,env(safe-area-inset-right,0px)) calc(24px + env(safe-area-inset-bottom,0px)) max(28px,env(safe-area-inset-left,0px))}
.big b{font-size:clamp(34px,9vw,64px);line-height:1.1;letter-spacing:-.02em;text-wrap:balance}
.big p{color:var(--fg2);font-size:17px;margin:16px 0 0}
.big .ib{position:absolute;top:calc(12px + env(safe-area-inset-top,0px));right:calc(12px + env(safe-area-inset-right,0px));border-radius:22px;background:var(--fill)}

.route{border-bottom:1px solid var(--line);padding:12px 0}
.rh{display:flex;align-items:center;gap:12px;width:100%;text-align:left}
.rh .b{width:34px;height:34px;font-size:15px}
.rh .t{flex:1;min-width:0}
.rh .t b{display:block;font-size:16px;font-weight:700}
.rh .t small{display:block;font-size:13px;color:var(--fg2)}
.route .d{margin:8px 0 0 46px;font-size:14px;color:var(--fg2);max-width:60ch}
.line{margin:10px 0 0 46px;position:relative;list-style:none;padding:0}
.line::before{content:"";position:absolute;left:8px;top:12px;bottom:12px;width:4px;border-radius:2px;background:var(--lc)}
.line li{position:relative;padding:5px 0 5px 30px}
.line li::before{content:"";position:absolute;left:3px;top:10px;width:14px;height:14px;border-radius:50%;background:var(--bg);border:3px solid var(--lc);box-sizing:border-box}
.line li.walk{padding:2px 0 2px 30px;font-size:12.5px;color:var(--fg2);font-style:italic}
.line li.walk::before{display:none}
.line button{text-align:left;width:100%}
.line b{font-weight:600;font-size:14.5px}
.line small{display:block;font-size:12.5px;color:var(--fg2);font-variant-numeric:tabular-nums}
.rbar{display:flex;gap:8px;margin:10px 0 0 46px;align-items:center;flex-wrap:wrap}
.pill{height:36px;padding:0 14px;border-radius:18px;background:var(--fill);font-size:13.5px;font-weight:600;display:inline-flex;align-items:center;gap:6px;text-decoration:none}
.pill.solid{background:var(--fg);color:var(--bg)}
.cost{font-size:13px;color:var(--fg2);font-variant-numeric:tabular-nums}

.sec{margin-top:22px}
.sec>h3{margin:0 0 8px;font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--fg2);display:flex;justify-content:space-between}
.sec>h3 span{letter-spacing:0;text-transform:none;font-weight:600}
.days{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none}
.days::-webkit-scrollbar{display:none}
.day{flex:1 0 44px;height:54px;border-radius:12px;border:1px solid var(--line);display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:11px;font-weight:600;color:var(--fg2)}
.day b{font-size:18px;color:var(--fg)}
.day[aria-pressed="true"]{background:var(--fg);border-color:var(--fg);color:var(--bg)}.day[aria-pressed="true"] b{color:var(--bg)}
.when{display:flex;align-items:baseline;justify-content:space-between;margin:14px 0 0}
.when b{font-size:30px;font-weight:700;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.when span{font-size:14px;color:var(--fg2)}
input[type=range]{width:100%;accent-color:var(--fg);height:30px;margin:4px 0 0}
.ticks{display:flex;justify-content:space-between;font-size:10.5px;color:var(--fg3);font-variant-numeric:tabular-nums}
.bul{display:flex;flex-wrap:wrap;gap:6px}
.bul button{display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 10px 0 3px;border-radius:16px;background:var(--fill);font-size:13px;font-weight:600}
.bul .b{width:26px;height:26px;font-size:10px;box-shadow:none}.bul .b.x{width:18px;height:18px;margin:4px}
.week{display:grid;grid-template-columns:44px 1fr;border-top:1px solid var(--line)}
.week>div{padding:8px 0;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:4px;flex-wrap:wrap;min-height:44px}
.week .dn{font-weight:700;font-size:13px}
.week .on{color:var(--fg)}
.week .dn.today::after{content:"";width:6px;height:6px;border-radius:50%;background:var(--fg);margin-left:4px}
.week .b{width:24px;height:24px;font-size:9.5px;box-shadow:none}.week .b.x{width:17px;height:17px;margin:3.5px}
.week .none{color:var(--fg3);font-size:13px}
.mrow{padding:10px 0;border-bottom:1px solid var(--line)}
.mrow .l1{align-items:center}
.mrow .wins{font-size:12.5px;color:var(--fg2);margin-top:2px;font-variant-numeric:tabular-nums}
.pts{display:flex;justify-content:space-between;font-size:12px;color:var(--fg2);margin-top:8px;font-variant-numeric:tabular-nums}
.pts b{display:block;color:var(--fg);font-size:13.5px}
.bento{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.tile{background:var(--fill);border-radius:var(--r);padding:12px;min-width:0;display:flex;flex-direction:column;gap:3px}
.tile b{font-size:22px;font-weight:700;letter-spacing:-.02em;line-height:1.1;font-variant-numeric:tabular-nums}
.tile span{font-size:13px;color:var(--fg2);line-height:1.35}
.tile.w{grid-column:1/-1}
.tile.k{background:var(--fg);color:var(--bg)}.tile.k span{color:color-mix(in srgb,var(--bg) 72%,var(--fg))}
.meter{display:flex;gap:3px;margin-top:6px}
.meter i{flex:1;height:6px;border-radius:2px;background:color-mix(in srgb,var(--bg) 25%,var(--fg))}
.meter i.on{background:var(--bg)}

.set{display:flex;align-items:center;justify-content:space-between;min-height:52px;border-bottom:1px solid var(--line);font-size:15px;gap:12px;width:100%;text-align:left}
.sw{width:51px;height:31px;border-radius:16px;background:var(--line);position:relative;flex:none;transition:background .2s}
.sw::after{content:"";position:absolute;top:2px;left:2px;width:27px;height:27px;border-radius:50%;background:#fff;box-shadow:0 2px 4px rgba(0,0,0,.25);transition:left .2s}
.sw[aria-checked="true"]{background:var(--ok)}.sw[aria-checked="true"]::after{left:22px}
.key{display:grid;grid-template-columns:auto 1fr;gap:8px 10px;align-items:center;font-size:14px}
.steps{list-style:none;padding:0;margin:0;counter-reset:s}
.steps li{counter-increment:s;display:flex;gap:12px;align-items:flex-start;padding:8px 0;font-size:14.5px}
.steps li::before{content:counter(s);flex:none;width:24px;height:24px;border-radius:12px;background:var(--fg);color:var(--bg);font-size:12px;font-weight:700;display:grid;place-items:center}
.steps svg{vertical-align:-4px;width:18px;height:18px}
.seg{display:flex;background:var(--fill);border-radius:9px;padding:2px;margin-bottom:6px}
.seg button{flex:1;height:30px;border-radius:7px;font-size:13px;font-weight:600;color:var(--fg2)}
.seg button[aria-pressed="true"]{background:var(--bg);color:var(--fg);box-shadow:0 1px 3px rgba(0,0,0,.15)}

@media (min-width:860px){
  .sheet{left:calc(12px + env(safe-area-inset-left,0px));right:auto;top:12px;bottom:12px;width:390px;height:auto;border-radius:16px;transform:none!important;box-shadow:var(--sh)}
  .grab{height:10px}.grab i{display:none}
  .island{left:calc(414px + (100% - 414px)/2)}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div id="map" role="application" aria-label="Map of Istanbul"></div>
<div class="attr" id="attr">© OpenStreetMap · © CARTO</div>
<button class="island glass" id="island" aria-label="Open plan"></button>
<div class="rail">
  <div class="grp glass">
    <button class="ib" id="bLoc" aria-label="Show my location" aria-pressed="false"><svg class="i" viewBox="0 0 24 24"><path d="M3 11 21 3l-8 18-2-8z"/></svg></button>
  </div>
  <div class="grp glass">
    <button class="ib" id="bIn" aria-label="Zoom in"><svg class="i" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></button>
    <button class="ib" id="bOut" aria-label="Zoom out"><svg class="i" viewBox="0 0 24 24"><path d="M5 12h14"/></svg></button>
  </div>
</div>
<div class="toast" id="toast" role="status" hidden></div>

function prayer(date){
  const R=Math.PI/180,lat=41.0082*R,lng=28.9784,tz=3,y=date.getFullYear(),mo=date.getMonth()+1,da=date.getDate();
  const A=Math.floor((14-mo)/12),Y=y+4800-A,M=mo+12*A-3;
  const D=da+Math.floor((153*M+2)/5)+365*Y+Math.floor(Y/4)-Math.floor(Y/100)+Math.floor(Y/400)-32045-2451545;

  let ra=Math.atan2(Math.cos(e)*Math.sin(L),Math.cos(L))/R/15;ra=(ra%24+24)%24;
  const dec=Math.asin(Math.sin(e)*Math.sin(L));let eq=(q/15%24+24)%24-ra;if(eq>12)eq-=24;if(eq<-12)eq+=24;
  const noon=12+tz-lng/15-eq,T=a=>Math.acos((-Math.sin(a*R)-Math.sin(dec)*Math.sin(lat))/(Math.cos(dec)*Math.cos(lat)))/R/15;
  const asr=-Math.atan(1/(1+Math.tan(Math.abs(lat-dec))))/R;
  return{Fajr:(noon-T(18))*60,Sunrise:(noon-T(.833))*60-7,Dhuhr:noon*60+5,Asr:(noon+T(asr))*60+4,Maghrib:(noon+T(.833))*60+7,Isha:(noon+T(17))*60+1,sunset:(noon+T(.833))*60};
}

function status(p,M=moment()){
  const{d,min}=M;

  if(!p.h)return{c:"",t:"",open:0};
  if(p.h[0]==="00:00")return{c:"open",t:"Open 24 h",open:1};
  if(p.cl&&p.cl.includes(d.getDay()))return{c:"closed",t:"Closed "+DOWL[d.getDay()]+"s",open:0};
  const o=m2(p.h[0]),c=m2(p.h[1]);
  if(min<o)return{c:"closed",t:"Opens "+p.h[0],open:0};
  if(min>=c)return{c:"closed",t:"Closed · opens "+p.h[0],open:0};
  for(const[a,b]of blocks(p,d))if(min>=a&&min<b)return{c:"warn",t:"Prayer · back ~"+fmt(b),open:0};
  const nb=blocks(p,d).find(([a])=>a>min&&a-min<=45);if(nb)return{c:"warn",t:"Prayer closure ~"+fmt(nb[0]),open:1};

}

  $("#back").onclick=()=>{detail=null;sel=null;drawPins();try{history.replaceState(null,"",location.pathname)}catch(e){}render()};
  $("#vis").onclick=()=>{S.visited.has(p.id)?S.visited.delete(p.id):S.visited.add(p.id);st.set("im-v",[...S.visited]);renderDetail();drawPins()};
  $("#share").onclick=()=>share(p.n,location.href.split("#")[0]+"#"+p.id);
  $("#ask").onclick=()=>{const b=$("#big");b.innerHTML=`<button class="ib" id="bigX" aria-label="Close">${I.x}</button><b lang="tr">${esc(p.ask)} nasıl gidebilirim?</b><p lang="tr">${esc(p.tr)}</p><p>How do I get to ${esc(p.n)}?</p>`;b.hidden=false;$("#bigX").onclick=()=>b.hidden=true;$("#bigX").focus()};
}
function clearRoute(){routeLine&&routeLine.remove();routeLine=null;activeRoute=null;drawPins()}
function showRoute(r){
  clearRoute();activeRoute=r;const pts=stops(r).map(([i])=>byId[i].ll);
  routeLine=L.polyline(pts,{renderer:Rtop,weight:5,opacity:.9,lineCap:"round",lineJoin:"round",dashArray:r.mode==="transit"?"1 9":null,color:tok(AREA[r.a].c),interactive:false}).addTo(map);
  drawPins();map.flyToBounds(L.latLngBounds(pts),{paddingTopLeft:desk()?[430,70]:[40,70],paddingBottomRight:desk()?[70,40]:[40,innerHeight*.52],duration:.5,maxZoom:16});
}
function routeCost(r){let t=0,np=0;for(const[i]of stops(r)){const p=byId[i];if(p.shut)continue;const u=usd(p);t+=u;if(!p.pass)np+=u}return{t:Math.round(t),np:Math.round(np)}}
function renderRoutes(){
  const M=moment(),dw=M.d.getDay(),dl=M.live?"today":DOW[dw];
  const rank=r=>(r.best&&r.best.includes(dw))?0:(r.avoid&&r.avoid.includes(dw))?2:1;
  const list=ROUTES.filter(r=>!r.best||r.best.includes(dw)||activeRoute===r).sort((a,b)=>rank(a)-rank(b));
  body.innerHTML=list.map(r=>{const on=activeRoute===r,A=AREA[r.a],bad=r.avoid&&r.avoid.includes(dw),c=routeCost(r);
   return`<div class="route"><button class="rh" data-r="${r.id}" aria-expanded="${on}"><span class="b${A.y?" y":""}" style="background:${col(r.a)}"><span>${r.id}</span></span><span class="t"><b>${esc(r.n)}</b><small>${esc(r.meta)}${bad?` · <span class="s-closed">Not ${dl}</span>`:r.best?` · <span class="s-open">Made for ${dl}</span>`:""}</small></span></button>
   ${on?`<p class="d">${esc(r.d)}</p><ol class="line" style="--lc:${col(r.a)}">${r.s.map(x=>{if(!Array.isArray(x))return`<li class="walk">${esc(x)}</li>`;const p=byId[x[0]],s=status(p,{d:M.d,min:m2(x[1].slice(0,5).match(/^\d\d:\d\d$/)?x[1].slice(0,5):"12:00")});return`<li><button data-id="${p.id}"><b>${esc(p.n)}</b><small>${esc(x[1])} · ${price(p)}${usd(p)?" "+usdS(p):""}${p.pass?" · Pass":""}${s.open||p.free?"":` · <span class="s-closed">${esc(s.t)}</span>`}</small></button></li>`}).join("")}</ol>
   <div class="rbar"><a class="pill solid" href="${gRoute(r)}" target="_blank" rel="noopener">${I.dir}Directions</a><button class="pill" data-share="${r.id}" aria-label="Share route">${I.share}</button><button class="pill" data-close aria-label="Close route">${I.x}</button>
   <span class="cost">${c.t?`Tickets ≈ $${c.t}${c.np!==c.t?` · $${c.np} with pass`:""}`:"No tickets"}</span></div>`:""}</div>`}).join("")
   +`<p class="foot">Solid line: on foot. Dotted: tram, bus or ferry. Directions open in Google Maps with every stop; Apple Maps takes one stop at a time from each place.</p>`;
  body.querySelectorAll(".rh").forEach(b=>b.onclick=()=>{const r=ROUTES.find(x=>x.id===b.dataset.r);activeRoute===r?clearRoute():showRoute(r);renderRoutes()});
  body.querySelectorAll(".line [data-id]").forEach(b=>b.onclick=()=>openPlace(b.dataset.id));
  const c=body.querySelector("[data-close]");if(c)c.onclick=()=>{clearRoute();renderRoutes()};
  const sh=body.querySelector("[data-share]");if(sh)sh.onclick=()=>share("Istanbul: "+activeRoute.n,gRoute(activeRoute));
}
function renderPlan(){
  const now=ist(),M=moment(),pt=prayer(M.d),dw=M.d.getDay(),dl=M.live?"today":"on "+DOWL[dw];
  const days=[...Array(7)].map((_,i)=>{const d=new Date(now);d.setDate(d.getDate()+i);return d});
  const pool=P.filter(p=>!p.x||S.extras),open=pool.filter(p=>status(p,M).open).length;
  const closed=pool.filter(p=>p.shut||(p.cl&&p.cl.includes(dw)));
  const mosques=pool.filter(p=>p.mq);
  const paid=P.filter(p=>!p.free&&(p.eur||p.try)),passN=paid.filter(p=>p.pass).length;
  const chip=p=>`<button data-id="${p.id}">${bullet(p)}${esc(p.n)}</button>`;
  const week=[1,2,3,4,5,6,0].map(d=>{const c=pool.filter(p=>p.cl&&p.cl.includes(d));return`<div class="dn${d===dw?" today":""}">${DOW[d]}</div><div>${c.length?c.map(p=>`<span title="${esc(p.n)}">${bullet(p)}</span>`).join(""):'<span class="none">Everything open</span>'}${d===5?'<span class="none" style="margin-left:4px">Mosques shut ~11:30–14:30</span>':""}</div>`}).join("");
  body.innerHTML=`
  <div class="sec" style="margin-top:8px"><div class="days">${days.map((d,i)=>`<button class="day" data-d="${i}" aria-pressed="${i===M.off}">${i===0?"Today":DOW[d.getDay()]}<b>${d.getDate()}</b></button>`).join("")}</div>
   <div class="when"><b>${fmt(M.min)}</b><span>${open} of ${pool.length} open${M.live?"":` · <button class="s-open" id="live" style="font-weight:600">Now</button>`}</span></div>
   <input id="tm" type="range" min="420" max="1410" step="15" value="${Math.min(1410,Math.max(420,M.min))}" aria-label="Time of day">
   <div class="ticks"><span>07</span><span>11</span><span>15</span><span>19</span><span>23</span></div></div>
  <div class="sec"><h3>Closed ${dl}<span>${closed.length}</span></h3>${closed.length?`<div class="bul">${closed.map(chip).join("")}</div>`:'<p class="foot" style="margin:0">Everything is open.</p>'}</div>
  <div class="sec"><h3>Every week</h3><div class="week">${week}</div></div>
  ${mosques.length?`<div class="sec"><h3>Mosque visits ${dl}<span>approx.</span></h3>
   ${mosques.map(p=>`<button class="mrow" data-id="${p.id}" style="width:100%;text-align:left"><span class="l1">${bullet(p)}<b style="flex:1">${esc(p.n)}</b></span><div class="wins">${windows(p,M.d).map(([a,b])=>fmt(a)+"–"+fmt(b)).join("  ·  ")||"No visitor time"}</div></button>`).join("")}
   <div class="pts">${["Dhuhr","Asr","Maghrib","Isha"].map(k=>`<span>${k}<b>${fmt(pt[k])}</b></span>`).join("")}</div>
   <p class="foot" style="margin-top:8px">Mosques close to visitors from shortly before each prayer for 45–60 min. Hagia Sophia's gallery stays open except Friday noon.</p></div>`:""}
  <div class="sec"><h3>Good to know</h3><div class="bento">
   <div class="tile k w"><b>${passN} of ${paid.length}</b><span>paid sights take Museum Pass Istanbul. It runs 5 days from first entry, once per site, and skips ticket lines (not security). Not accepted at Hagia Sophia, the cisterns, Dolmabahçe, Beylerbeyi, Chora or private museums.</span><div class="meter">${paid.map(p=>`<i class="${p.pass?"on":""}"></i>`).join("")}</div></div>
   <div class="tile"><b>09:00</b><span>Big sights at opening. Tour groups arrive from 10:00.</span></div>
   <div class="tile"><b>${fmt(pt.sunset)}</b><span>Sunset ${dl}. Galata Tower, Maiden's Tower, Süleymaniye terrace.</span></div>
   <div class="tile"><b>1 + 1</b><span>Two big sights a day is plenty. Topkapı alone is three hours.</span></div>
   <div class="tile"><b>Cover up</b><span>Mosques: shoulders, knees and hair. Shoes off.</span></div>
   <div class="tile w"><b>T1 tram</b><span>Kabataş, Karaköy, Eminönü, Gülhane, Sultanahmet, Beyazıt. Tap a contactless bank card at the gate, or buy an İstanbulkart from the yellow machines.</span></div>
   <div class="tile"><b>Ferries</b><span>Public boats to Üsküdar and Kadıköy are the cheapest Bosphorus views.</span></div>
   <div class="tile"><b>Lira</b><span>Cards work almost everywhere. Euro prices are charged in lira at the day's rate.</span></div>
  </div></div>
  <p class="foot">Prices from official sources, autumn 2026. Dollar amounts at ₺${FX.usdTry} = $1 and €1 = $${FX.eurUsd}.</p>`;
  body.querySelectorAll(".day").forEach(b=>b.onclick=()=>{const i=+b.dataset.d;at=(i===0&&!at)?null:{day:i,min:at?at.min:Math.max(540,moment().min)};sync()});
  const tm=$("#tm");tm.oninput=()=>{at={day:M.off,min:+tm.value};sync(true)};
  const lv=$("#live");if(lv)lv.onclick=()=>{at=null;sync()};
}
function sync(keep){drawPins();island();if(keep&&tab==="plan"){const v=$("#tm").value,sc=body.scrollTop;renderPlan();bindRows();const t=$("#tm");t.value=v;t.focus();body.scrollTop=sc}else render()}
function bindRows(){body.querySelectorAll("[data-id]").forEach(b=>{if(!b.onclick)b.onclick=()=>openPlace(b.dataset.id)})}
function render(){
  if(detail==="__set")return renderSettings();
  if(detail)return renderDetail();
  tab==="places"?renderPlaces():tab==="routes"?renderRoutes():renderPlan();
  bindRows();
}
function island(){
  const M=moment(),pool=P.filter(p=>!p.x||S.extras),open=pool.filter(p=>status(p,M).open).length;
  $("#island").innerHTML=`<i class="dot${M.live?"":" past"}"></i>${M.live?"":DOW[M.d.getDay()]+" "}${fmt(M.min)}<small>${open} open</small>`;
}
$("#island").onclick=()=>{setTab("plan");if(snap<1)setSnap(1)};

const isIOS=/iP(hone|ad|od)/.test(navigator.userAgent)||(navigator.platform==="MacIntel"&&navigator.maxTouchPoints>1);
const standalone=matchMedia("(display-mode: standalone)").matches||navigator.standalone;
let installEvt=null;addEventListener("beforeinstallprompt",e=>{e.preventDefault();installEvt=e});
let guide=isIOS?"ios":"android";
function renderSettings(){
  detail="__set";
  const sw=(id,on,label)=>`<button class="set" id="${id}" role="switch" aria-checked="${on}"><span>${label}</span><span class="sw" aria-checked="${on}"></span></button>`;
  const iosSteps=`<ol class="steps"><li>Open this page in Safari.</li><li>Tap Share <svg class="i" viewBox="0 0 24 24"><path d="M12 15V3M7.5 7.5 12 3l4.5 4.5M5 12v8h14v-8"/></svg> in the toolbar.</li><li>Scroll and tap Add to Home Screen.</li><li>Tap Add. It opens full screen, like an app.</li></ol>`;
  const andSteps=`<ol class="steps"><li>Open this page in Chrome.</li><li>Tap the ⋮ menu, top right.</li><li>Tap Add to Home screen, then Install.</li></ol>${installEvt?'<button class="pill solid" id="inst" style="margin-top:6px">Install now</button>':""}`;
  body.innerHTML=`<div class="top"><button class="ib" id="back" aria-label="Close settings">${I.x}</button><b>Settings</b></div>
   ${sw("sd",S.dark,"Dark mode")}${sw("sx",S.extras,"Show ◆ sights beyond state museums")}${sw("st",S.transit,"Tram, metro and ferry lines")}
   <div class="sec"><h3>Add to Home Screen</h3>${standalone?'<p class="foot" style="margin:0">Already installed. You\'re using the app.</p>':`<div class="seg"><button data-g="ios" aria-pressed="${guide==="ios"}">iPhone</button><button data-g="android" aria-pressed="${guide==="android"}">Android</button></div>${guide==="ios"?iosSteps:andSteps}`}</div>
   <div class="sec"><h3>Colours</h3><div class="key">${Object.values(AREA).map(a=>`<i class="b${a.y?" y":""}" style="background:var(${a.c});width:16px;height:16px;box-shadow:none"></i><span>${a.n}</span>`).join("")}<span class="b" style="background:var(--fg3);width:16px;height:16px;box-shadow:none"></span><span>State museum</span><span class="b x" style="background:var(--fg3);width:12px;height:12px;margin:2px;box-shadow:none"></span><span>Also worth it</span></div></div>
   <div class="sec"><h3>Your visits</h3><button class="set" id="reset"><span>Clear visited marks</span><span class="cost">${S.visited.size}</span></button></div>
   <p class="foot">Hours and prices change; check before you go. Map data © OpenStreetMap contributors, tiles © CARTO.</p>`;
  $("#back").onclick=()=>{detail=null;setTab(tab)};
  $("#sd").onclick=()=>{S.dark=!S.dark;st.set("im-d",S.dark);applyTheme();drawPins();renderSettings()};
  $("#sx").onclick=()=>{S.extras=!S.extras;st.set("im-x",S.extras);drawPins();island();renderSettings()};
  $("#st").onclick=()=>{S.transit=!S.transit;st.set("im-t",S.transit);S.transit?railL.addTo(map):railL.remove();renderSettings()};
  $("#reset").onclick=()=>{S.visited.clear();st.set("im-v",[]);drawPins();renderSettings();toast("Visited marks cleared")};
  body.querySelectorAll("[data-g]").forEach(b=>b.onclick=()=>{guide=b.dataset.g;renderSettings()});
  const inst=$("#inst");if(inst)inst.onclick=async()=>{installEvt.prompt();await installEvt.userChoice;installEvt=null;renderSettings()};
}
$("#bSet").onclick=()=>{document.querySelectorAll(".tabs button").forEach(b=>b.setAttribute("aria-selected","false"));renderSettings();body.scrollTop=0;if(!desk()&&snap<1)setSnap(1)};
addEventListener("keydown",e=>{if(e.key==="Escape"&&!$("#big").hidden)$("#big").hidden=true});

map.fitBounds(L.latLngBounds(P.filter(p=>["sa","gh","bg"].includes(p.a)).map(p=>p.ll)),{paddingTopLeft:desk()?[420,40]:[24,70],paddingBottomRight:desk()?[60,40]:[24,innerHeight*.5],maxZoom:16});
applyTheme();if(S.transit)railL.addTo(map);drawPins();island();setSnap(1);render();
const fromHash=()=>{const id=location.hash.slice(1);if(byId[id])openPlace(id)};addEventListener("hashchange",fromHash);fromHash();
setInterval(()=>{if(!at){drawPins();island();if(!detail&&tab!=="plan")render()}},60000);
if("serviceWorker" in navigator&&location.protocol==="https:")navigator.serviceWorker.register("sw.js").catch(()=>{});
</script>
